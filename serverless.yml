service: abap-package-version-shield
org: sbcgua
app: abapversionshield

# stages:
#   default:
#     params:
#       key1: devValue
#   prod:
#     params:
#       key1: prodValue

# Notes: strange bug: requires npm run esbuild first ... not sure why

build:
  esbuild:
    bundle: true
    minify: false
    metafile: true
    sourcemap: false

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-1
  stage: ${opt:stage, 'dev'}

# package:
#   patterns:
#     - '!**'
#     - 'dist/out.js'
#     - 'package.json'

functions:
  getAbapVersionShieldJson:
    handler: dist/out.getShieldJson
    memorySize: 128
    events:
      - http:
          path: version-shield-json/{sourcePath+}
          method: get
          cors: true
      - http:
          path: /
          # cors: true
          method: get
          integration: mock
          request:
            template:
              application/json: '{"statusCode": 301}'
          response:
            template: redirect
            headers:
              Location: "'https://sbcgua.github.io/abap-package-version-shield'"
            statusCodes:
              301:
                pattern: ''

